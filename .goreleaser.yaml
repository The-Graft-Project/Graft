# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/graft
    binary: graft
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

# Homebrew Tap (macOS and Linux)
brews:
  - # GitHub repository for your Homebrew tap
    # You'll need to create a repo named homebrew-tap (or homebrew-<anything>)
    name: graft
    repository:
      owner: the-graft-project  # Your GitHub username
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    
    # Commit author for Homebrew formula updates
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    
    # Directory inside the repository where formula will be stored
    directory: Formula
    
    # Homepage of your project
    homepage: "https://github.com/the-graft-project/graft"
    
    # Description for Homebrew
    description: "Agentless deployment tool extending Docker Compose to cloud via SSH"
    
    # License
    license: "MIT"
    
    # Install script
    install: |
      bin.install "graft"
    
    # Test to verify installation
    test: |
      system "#{bin}/graft --version"

# Debian/Ubuntu APT repository (using Fury.io or custom repo)
nfpms:
  - # Package name
    package_name: graft
    
    # Your info
    vendor: skssmd
    homepage: https://github.com/the-graft-project/graft
    maintainer: skssmd <skssmd78475@gmail.com>
    
    # Description
    description: Agentless deployment tool extending Docker Compose to cloud via SSH
    
    # License
    license: MIT
    
    # Formats to generate
    formats:
      - deb      # Debian/Ubuntu
      - rpm      # RedHat/Fedora
      - apk      # Alpine
      - archlinux # Arch Linux
    
    # No dependencies - graft is a standalone binary
    # It installs docker/docker-compose/git on target servers via SSH
    
    # Files to include
    contents:
      # Man pages (optional)
      # - src: ./manpages/graft.1.gz
      #   dst: /usr/share/man/man1/graft.1.gz
      
      # Completion scripts (optional)
      # - src: ./completions/graft.bash
      #   dst: /usr/share/bash-completion/completions/graft
      
      # Config files (optional)
      # - src: ./config/graft.yml
      #   dst: /etc/graft/config.yml
      #   type: config

# AUR (Arch User Repository)
aurs:
  - # AUR package name (GoReleaser will use graft-bin for binary packages)
    name: graft-bin
    
    # Your AUR SSH key (you'll need to set this up)
    # Generate with: ssh-keygen -t ed25519 -C "aur@archlinux.org"
    # Add to AUR: https://aur.archlinux.org/account/
    private_key: "{{ .Env.AUR_SSH_KEY }}"
    
    # Git URL for AUR repository
    git_url: "ssh://aur@aur.archlinux.org/graft-bin.git"
    
    # Package description (AUR requires max 80 chars, no period at end)
    description: "Agentless deployment tool extending Docker Compose to cloud via SSH"
    
    # Maintainers
    maintainers:
      - "skssmd <skssmd78475@gmail.com>"
    
    # Contributors (optional)
    contributors:
      - "skssmd <skssmd78475@gmail.com>"
    
    # License
    license: MIT
    
    # Homepage
    homepage: "https://github.com/skssmd/graft"
    
    # No dependencies - graft is a standalone binary
    # It installs docker/docker-compose/git on remote servers via SSH
    
    # Commit author
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
winget:
  - name: Graft
    publisher: skssmd
    package_identifier: skssmd.Graft 
    license: MIT
    copyright: Copyright (c) 2025 skssmd
    homepage: https://github.com/the-graft-project/graft
    short_description: A high-performance, zero-overhead deployment engine that extends the Docker Compose workflow to cloud infrastructure via SSH
    description: |
      A high-performance, zero-overhead deployment engine that extends the Docker Compose workflow 
      to cloud infrastructure via SSH. Graft enables native remote management of AWS, GCP, and VPS 
      instances with no agent installs or server-side overhead required. With V2.0 Graft is now 
      optimized for git and github actions ci/cd flow
    
    tags:
      - graft
      - deployment
      - devops
      - dev ops
      - easy deployment
      - docker compose
      - docker
      - ssh
      - hosting
      - cloud
    
    publisher_url: https://github.com/skssmd
    publisher_support_url: https://github.com/skssmd/Graft/issues
    license_url: https://github.com/skssmd/Graft/blob/main/LICENSE
    copyright_url: https://github.com/skssmd/Graft/blob/main/LICENSE
    release_notes_url: https://github.com/skssmd/Graft/releases/tag/v{{.Version}}
    
    author: skssmd
    
    # Installation notes
    release_notes: |
      - Service Scaling: Scale any service to N replicas with [graft scale <service> <n>] — Traefik load balances automatically. Scale persists through deploys.
      - PSQL Passthrough: Full psql passthrough with env-aware auto-connect. Supports all native psql flags (-c, -f, -t, etc.).
      - Isolated DB Credentials (Security): Each database gets a dedicated Postgres user and password. Admin credentials never leak to project secrets.
      - Per-Environment Database Linking: Database auto-linked per environment. [graft psql] connects to the right db for the current env.
      - Unified DB Init: Initialize databases from project scope, host scope [graft host db], or registry scope [graft -r <name> db]. All paths prompt to link with overwrite protection.
      - SSH Database Tunnel: [graft db <name> serve :port] tunnels remote Postgres to localhost via SSH for local dev tools. No public port exposure.
      - Generic Service Tunnel: [graft host tunnel <container> -port remote:local] tunnels any Docker container to localhost. Auto-detects exposed ports when -port is omitted.
      - Tunnel Port Flag Renamed (Breaking): The tunnel port mapping is now -port (or --port) instead of -p, since -p is the global project flag. Update any scripts that passed -p for a tunnel port.
      - Default Registry: [graft -default <name>] marks a registry as the fallback for work outside a project. With no -r, no -p and no project in the current directory, Graft runs what [graft -r <default> <command>] would have run.
      - SSH Connection Reliability: Multiple concurrent sessions and tunnels no longer hang. The liveness probe, SSH handshake and authentication, channel opens, and SFTP startup are all bounded by timeouts, so a half-dead connection fails fast and self-heals instead of blocking forever.
      - Faster Connections: SFTP starts only when a command actually transfers files, and tunnels no longer spend a network round trip probing liveness before each forwarded connection.
      - known_hosts Correctness (Security): Non-default ports are recorded in the format the lookup uses, so repeat connections stop appending duplicates. An unreadable known_hosts is reported instead of silently skipping host key verification.
      - Environment Listing: [graft env ls] shows all environments with registry, domain, and mode.
      - Graft SSH Key: Manage SSH keys with [graft pub] and rotate with [graft pub rollout].
      - Cloudflare API Integration: Automated DNS zone mapping based on Traefik host labels.
      - Cloudflare Zone Registry: Manage multiple Cloudflare accounts and zones with an interactive selection menu.
      - Database Backup Automation: Backup infrastructure databases to S3/R2 (Experimental).
      - Rollback to versions: Rollback and revert changes to previous deployments.
      - Docker Passthrough Commands: Execute docker commands on remote hosts or registries via Graft.
      - Optimized for Git and GitHub Actions CI/CD flows.
      - Multi-environment support with separate configs, workflows, and DNS.
      - Webhook detection and error handling.
    
    # Repository configuration
    repository:
      owner: the-graft-project                    # ← CHANGED: Your fork, not microsoft
      name: winget-pkgs
      branch: "{{.ProjectName}}-{{.Version}}-{{.ShortCommit}}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft             # ← PR still targets microsoft
          name: winget-pkgs
          branch: master
    
    commit_author:
      name: skssmd
      email: skssmd78475@gmail.com
    
    commit_msg_template: "New version: {{ .PackageIdentifier }} version {{ .Tag }}"
    
    # Skip upload for testing
    skip_upload: false

# Snapcraft (Snap Store)
# snapcrafts:
#   - # Snap name
#     name: graft
    
#     # Description
#     summary: Agentless deployment tool extending Docker Compose to cloud via SSH
#     description: A simple agentless deployment engine that extends the Docker Compose workflow to cloud infrastructure via SSH. Graft enables native remote management of AWS, GCP, and VPS instances with no agent installs or server-side overhead required. With features like DNS Configurations, Rollbacks, CI/CD Workflow
    
#     # License
#     license: MIT
    
#     # Type of snap (classic or strict)
#     # Graft needs classic because it interacts with the local file system, SSH, and Git
#     confinement: classic
    
#     # Build to publish
#     publish: true
    
#     # Graded (devel or stable)
#     grade: stable

# Publishers for APT/RPM (using Gemfury, Cloudsmith, or custom)
# If you want to host your own APT repository, use this:
publishers:
  - name: fury.io
    # You'll need a Fury.io account token
    env:
      - FURY_TOKEN={{ .Env.FURY_TOKEN }}
    cmd: |
      curl -F package=@{{ .ArtifactPath }} https://{{ .Env.FURY_TOKEN }}@push.fury.io/skssmd/

release:
  # Set to true to create draft releases (you can publish manually after review)
  draft: false
  # Set to true to mark as prerelease for beta/rc tags
  prerelease: auto
  
  header: |
    ## Feature Update with Graft  🚀

    ### V2.7 Highlights: Database Backups

    1. **Database Backups**: `graft db <name> backup set` configures `pg_dump` backups of a single database to Cloudflare R2, AWS S3 or any S3-compatible bucket, on a schedule you choose (time zone, first run time, every 1-24 hours that divide the day). Each run checks the dump, uploads it, confirms the size in the bucket and then prunes backups older than your retention (7 days by default).
    2. **Backup Menu**: `graft db <name> backup list` shows every backup with a short id, the date and time in your local zone, age, size, a `latest` marker and whether it has been restore-tested. `test`, `restore` and `download` use the same menu; press Enter for the latest.
    3. **Verified Restore**: `backup test` restores a backup into an isolated throwaway database and runs seven logged checks (download size, archive signature, strict restore, schema, row counts against the live database, freshness, index health), then deletes it. `backup restore` always runs those checks first, takes a safety backup of the current data, restores in a single all-or-nothing transaction and asks you to type the database name.
    4. **Download Links and Prune by Id**: `backup download [-expires 24h]` prints a temporary signed link (up to 7 days) to fetch a backup straight from R2/S3. `backup prune` removes backups past the retention period; `backup prune <id>` keeps only that restore-tested backup and deletes every other one, however recent. A regular prune removes it too once it passes the retention period.
    5. **Telegram Alerts**: `backup alert` connects a Telegram bot and finds your chat id. You are alerted when a scheduled backup fails, when no backup has succeeded for more than two intervals, and when a restore or `prune <id>` runs. `backup log` shows the full log of every step.
    6. **Safer Infra Backup**: `graft infra db backup` now fails when the dump fails instead of uploading an empty file, checks the gzip and cleans up its temporary files.

    ### V2.0 - V2.6 Highlights:

    #### Deploying and managing projects
    1. **Rollback**: Revert to previous deployments with `graft rollback` or `graft rollback service <name>`.
    2. **Multi Environment Support**: Manage multiple deployment environments with separate configs, workflows and DNS. `graft env ls` lists all environments with their registry, domain and deployment mode.
    3. **Service Scaling**: Scale any service to N replicas with `graft scale <service> <n>` — Traefik automatically load balances across them. Scale persists through deploys.
    4. **Git Remote Modes and Automated GitHub Workflows**: Deploy through GitHub Workflows and CI/CD channels, with workflows generated from `graft-compose.yml`.
    5. **Graft-Hook and Webhook Mapping**: A webhook service for Graft-based servers, and mapping of webhook domains to servers.
    6. **Cloudflare Integration**: Automated DNS zone mapping and zone management.
    7. **Docker Passthrough Commands**: Execute docker commands on remote hosts or specific registries via Graft.
    8. **Default SSH Key and Default Registry**: Manage SSH keys with `graft pub` and rotate with `graft pub rollout`. `graft -default <name>` marks a registry as the fallback for work outside a project: when a command has no `-r`, no `-p` and no project in the current directory, Graft runs exactly what `graft -r <default> <command>` would have run, and says which registry it picked. `graft -default` on its own reports the current one, `graft registry ls` marks it, and deleting that registry clears it. `init`, `pub`, `projects` and `registry` already work without a project and are never redirected.

    #### Databases
    9. **Isolated DB Credentials (Security)**: `graft db <name> init` creates a dedicated Postgres user and password per database. Each project gets scoped credentials — admin credentials never leak to project secrets.
    10. **Per-Environment Database Linking and Unified Init**: The database name is stored per environment in project metadata, and `graft psql` auto-connects to the right database for the current env. Initialize databases from project scope (`graft db`), host scope (`graft host db`) or registry scope (`graft -r <registry> db`); all paths prompt to link to an environment with overwrite protection.
    11. **PSQL Passthrough**: Full psql passthrough with env-aware auto-connect. Supports all native psql flags (`-c`, `-f`, `-t`, etc.).

    #### Tunnels
    12. **SSH Database Tunnel**: `graft db <name> serve [:port]` tunnels remote Postgres to localhost via SSH — connect with pgAdmin, DBeaver or your local app. No public port exposure needed.
    13. **Service and Port Tunneling**: `graft host tunnel <container> [-port <remote>:<local>]` and `graft -r <reg> tunnel <container> -port <serverport>:<localport>` tunnel any Docker container or port to localhost, auto-detecting exposed ports when `-port` is omitted. Works with any protocol — HTTP, Postgres, Redis, gRPC. **Breaking:** the port flag is `-port` (or `--port`), not `-p`, because `-p` is the global project flag. Old `-p` port arguments are no longer recognized and fall back to auto-detection, so update any scripts that used `-p`. The tunnel reference is now in `documentations/COMMANDS.md`.

    #### Security and reliability
    14. **Dependency Security Update**: Upgraded `golang.org/x/crypto` to v0.57.0, resolving GitHub Dependabot alerts in the SSH package (auth bypass via unenforced revocation, permission enforcement bypass, deadlocks, DoS and panics).
    15. **SSH Connection Reliability**: Multiple concurrent sessions and tunnels no longer hang. Every network step is bounded by a timeout — the liveness probe, the SSH handshake and authentication, channel opens and the SFTP subsystem — so a half-dead connection (wifi blip, NAT idle drop, roaming) fails fast and self-heals instead of blocking forever. The SFTP subsystem starts only when a command transfers files, and tunnels no longer probe liveness before each forwarded connection.
    16. **known_hosts Correctness (Security)**: Hosts on non-default ports are recorded in the format the lookup uses, so repeat connections stop appending duplicate entries. An unreadable `known_hosts` is now reported instead of silently skipping host key verification.
    17. **Bug Fixes and Improvements**
  
  footer: |
    ---
    Released by **skssmd** using [GoReleaser](https://github.com/goreleaser/goreleaser).